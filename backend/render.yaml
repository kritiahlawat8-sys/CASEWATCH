services:
  - type: web
    name: casewatch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker & uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ECOURTS_API_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_MIN_INTERVAL_SECONDS
        value: "4"
